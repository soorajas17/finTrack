<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Page</title>
  <link rel="icon" type="image/jpg"
    href="https://img.favpng.com/24/12/8/net-profit-net-income-clip-art-png-favpng-Q00aG3GnTmdMwYqXNwu6K1t58.jpg" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
</head>

<body style="background-color: whitesmoke">
  <div class="container mt-5">

    <div class="text-center mb-4">
      <h1 class="text-success fw-semibold" style="font-family: 'Times New Roman', Times, serif; font-size: 55px;">
        <i>FinTrack</i>
      </h1>
      <p class="text-success fs-5">Guiding Family Finances Together..</p>
    </div>

    <div class="row justify-content-center align-items-center mt-5">
      <!-- Image  -->
      <div class="col-md-5 mb-4 mb-md-0">
        <img
          src="https://cdni.iconscout.com/illustration/premium/thumb/business-budget-illustration-download-in-svg-png-gif-file-formats--strategy-investment-advisor-planning-financial-pack-illustrations-4973200.png"
          class="img-fluid rounded" alt="Finance Illustration" />
      </div>

      <!-- Register Form -->
      <div class="col-md-5 p-4 border rounded bg-light shadow-sm">
        <h3 class=" fw-semibold mb-4 text-center" style="font-size: 35px;">
          Register
        </h3>

        <form>
          <input type="text" id="uname" class="form-control form-control-sm mb-3 p-2 rounded-5"
            placeholder="Username" />
          <input type="email" id="email" class="form-control form-control-sm mb-3 p-2 rounded-5"
            placeholder="Email ID" />
          <input type="password" id="pswd" class="form-control form-control-sm mb-4 p-2 rounded-5"
            placeholder="Password" />
          <button type="button" onclick="addRegister()" class="btn btn-info text-white form-control p-2 rounded-5">
            Register
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <!-- JS -->
  <script src="./register.js"></script>
</body>

</html>
